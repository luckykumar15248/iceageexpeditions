# Ice Age Expeditions: Nginx reverse proxy for `next start` on 127.0.0.1:3000.
#
# Install:
#   sudo cp deploy/nginx/iceageexpeditions.conf /etc/nginx/sites-available/iceageexpeditions.conf
#   sudo ln -s /etc/nginx/sites-available/iceageexpeditions.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN below. TLS lines are the ones Certbot writes; keep yours if they already exist.
#
# Uploads live outside the release folder so redeploys never delete them:
#   MEDIA_ROOT=/var/lib/iceageexpeditions/uploads   (set in the app's production environment)
#   Files end up at /var/lib/iceageexpeditions/uploads/{media,videos,expeditions}/<hex>.<ext>

upstream iceage_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Nginx defaults to 1m and answers 413 before Next.js sees the request.
    # Must be >= MEDIA_UPLOAD_BODY_LIMIT in next.config.ts (82mb).
    client_max_body_size 100m;
    client_body_timeout 300s;

    # Uploaded media: served straight from disk; falls back to the Next.js /uploads route handler.
    # `root` (not `alias`) so try_files resolves correctly: /uploads/x -> /var/lib/iceageexpeditions/uploads/x
    location /uploads/ {
        root /var/lib/iceageexpeditions;
        try_files $uri @next;

        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
            video/mp4  mp4 m4v;
            video/webm webm;
        }
        default_type application/octet-stream;

        # Filenames are random hex and never overwritten, so long-lived caching is safe.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        proxy_pass http://iceage_next;
        include /etc/nginx/snippets/iceage-proxy.conf;
    }

    location @next {
        proxy_pass http://iceage_next;
        include /etc/nginx/snippets/iceage-proxy.conf;
    }
}

